[profile.default]
src = "src"
out = "out"
libs = ["lib"]

[profile.simbolik]
out = "out/simbolik"
cache_path = "cache/simbolik"
optimizer = false
build_info = true
extra_output = ["storageLayout", "evm.bytecode.generatedSources", "evm.bytecode.functionDebugData", "evm.deployedBytecode.functionDebugData", "evm.deployedBytecode.immutableReferences"]
bytecode_hash = "ipfs"
cbor_metadata = true
cache = true
use_literal_content = false
