---
  name: Release
  on:
    push:
      branches:
        - master
  
  jobs:
    tag-release:
      runs-on: [self-hosted, linux, flyweight]
      steps:
      - name: 'Check out repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.JENKINS_GITHUB_PAT }}
      - name: 'Determine Version'
        id: version
        run: |
          set -x
          # Use version from package/version if it exists, otherwise generate one
          if [ -f package/version ]; then
            VERSION=$(cat package/version | tr -d '[:space:]')
          else
            # Generate date-based version: YYYY.MM.DD
            VERSION=$(date +%Y.%m.%d)
          fi
          
          # Ensure tag is unique by appending build number if needed
          TAG="v${VERSION}"
          BUILD=0
          while git rev-parse "${TAG}" >/dev/null 2>&1; do
            BUILD=$((BUILD + 1))
            TAG="v${VERSION}.${BUILD}"
          done
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"
          echo "Using tag: ${TAG}"
          
      - name: 'Tag release'
        run: |
          set -x
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "${TAG}"
  
      - name: 'Update dependents'
        run: |
            set -x
            TAG="${{ steps.version.outputs.tag }}"
            curl --fail \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.JENKINS_GITHUB_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/runtimeverification/devops/dispatches \
            -d '{"event_type":"on-demand-test","client_payload":{"repo":"runtimeverification/simbolik-examples","version":"'${TAG}'"}}'